<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bollette{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
  <a href="{{ url_for('home.index') }}">Home</a>
  <a href="{{ url_for('bills.index') }}">Bollette</a>
  <a href="{{ url_for('bills.history_page') }}">Storico</a>
  <a href="{{ url_for('offers.index') }}">Offerte</a>
  <a href="{{ url_for('compare.index') }}">Confronto</a>
  <a href="{{ url_for('settings.index') }}">Impostazioni</a>
  <form method="post" action="{{ url_for('profiles.switch') }}" class="profile-switch">
    <input type="hidden" name="next" value="{{ request.full_path if request.method == 'GET' else '' }}">
    <select name="profile_id" onchange="this.form.submit()" aria-label="Profilo attivo">
      {% for p in profiles %}<option value="{{ p.id }}" {{ 'selected' if p.id == profile.id }}>{{ p.name }}</option>{% endfor %}
    </select>
    <noscript><button>Vai</button></noscript>
    <a href="{{ url_for('profiles.index') }}">Profili</a>
  </form>
</nav>
<main>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
