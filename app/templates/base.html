<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bollette{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav aria-label="Principale">
  {% set ep = request.endpoint or '' %}
  <a href="{{ url_for('home.index') }}" {{ 'aria-current=page' if ep == 'home.index' }}>Home</a>
  <a href="{{ url_for('bills.index') }}" {{ 'aria-current=page' if ep.startswith('bills.') and ep != 'bills.history_page' }}>Bollette</a>
  <a href="{{ url_for('bills.history_page') }}" {{ 'aria-current=page' if ep == 'bills.history_page' }}>Storico</a>
  <a href="{{ url_for('offers.index') }}" {{ 'aria-current=page' if ep.startswith('offers.') }}>Offerte</a>
  <a href="{{ url_for('compare.index') }}" {{ 'aria-current=page' if ep.startswith('compare.') }}>Confronto</a>
  <a href="{{ url_for('settings.index') }}" {{ 'aria-current=page' if ep.startswith('settings.') }}>Impostazioni</a>
  {% if profiles | length > 1 %}
  <form method="post" action="{{ url_for('profiles.switch') }}" class="profile-switch">
    <input type="hidden" name="next" value="{{ request.full_path if request.method == 'GET' else '' }}">
    <select name="profile_id" aria-label="Profilo attivo">
      {% for p in profiles %}<option value="{{ p.id }}" {{ 'selected' if p.id == profile.id }}>{{ p.name }}</option>{% endfor %}
    </select>
    <button>Cambia</button>
    <a href="{{ url_for('profiles.index') }}" {{ 'aria-current=page' if ep.startswith('profiles.') }}>Profili</a>
  </form>
  {% else %}
  <a class="nav-end" href="{{ url_for('profiles.index') }}" {{ 'aria-current=page' if ep.startswith('profiles.') }}>Profili</a>
  {% endif %}
</nav>
<main>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}" role="{{ 'alert' if category == 'warn' else 'status' }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
