[project]
name = "lg-invoices-analyzer"
version = "0.1.0"
description = "Analisi bollette luce/gas e confronto offerte, self-hosted"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "gunicorn>=22.0",
    "pypdf>=4.0",
    "anthropic>=0.40",
    "psycopg[binary]>=3.2",  # solo se DATABASE_URL punta a PostgreSQL
    "boto3>=1.34",  # solo se STORAGE_DRIVER=s3
]

[dependency-groups]
dev = ["pytest>=8.0", "moto[s3]>=5.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
